name: Probe trawl

# Temporary: does trawl get through APKMirror's Cloudflare from a GitHub runner?
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Start trawl
        run: |
          docker run -d --name trawl --shm-size=1gb -p 8191:8191 -p 8192:8192 \
            -e SESSION_CACHE_DRIVER=memory -e MITM_ENABLED=true -e MITM_DEBUG=true \
            ghcr.io/germondai/trawl:latest
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8191/health >/dev/null; then echo "trawl healthy after ~$((i*3))s"; break; fi
            sleep 3
          done
          curl -s http://127.0.0.1:8191/health; echo
          curl -s http://127.0.0.1:8191/proxy-ca.crt -o /tmp/ca.crt && head -c 60 /tmp/ca.crt; echo

      - name: Uptodown, can trawl get past the download gate?
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          ut() { curl -s --proxy http://127.0.0.1:8192 --cacert /tmp/ca.crt -A "$UA" "$@"; }
          for slug in youtube youtube-music reddit twitter instagram; do
            echo "versions page $slug (via proxy): $(ut -o /tmp/ut-$slug.html -w 'http %{http_code}' https://$slug.en.uptodown.com/android/versions)"
            echo "versions page $slug (direct)   : $(curl -s -o /dev/null -w 'http %{http_code}' -A "$UA" https://$slug.en.uptodown.com/android/versions)"
          done
          ID=$(grep -o 'data-version-id="[0-9]*"' /tmp/ut-youtube.html | head -1 | grep -o '[0-9]*')
          echo "youtube version id: $ID"
          curl -s -X POST http://127.0.0.1:8191/scrape -H 'content-type: application/json' \
            -d "{\"url\":\"https://youtube.en.uptodown.com/android/download/$ID\",\"skipHttp\":true,\"networkLogs\":true,\"maxTimeout\":120000,\"contentWaitForSelector\":\"#detail-download-button\"}" \
            -o /tmp/ut-scrape.json -w "scrape http %{http_code} in %{time_total}s\n"
          jq '{statusCode, tier, timings}' /tmp/ut-scrape.json | head -20
          echo "button tag: $(jq -r '.html // empty' /tmp/ut-scrape.json | grep -o '<button id="detail-download-button"[^>]*>' | head -1 | cut -c1-300)"
          echo "turnstile widget present: $(jq -r '.html // empty' /tmp/ut-scrape.json | grep -c 'download-turnstile-widget')"
          echo "network entries mentioning download: $(jq -r '[.networkLogs[]? | select(.url | test("download|turnstile|post"))] | length' /tmp/ut-scrape.json)"
          jq -r '.networkLogs[]? | select(.url | test("post-download|dw\\.uptodown|dwn")) | .url' /tmp/ut-scrape.json | head -5
        continue-on-error: true

      - name: trawl logs
        if: always()
        run: docker logs trawl 2>&1 | tail -120 | cut -c1-220
