name: Daily build

# Checks every app once a day and only builds the ones whose inputs changed: a new stable patch
# release, a new supported app version, a new CLI minor version, or changed config.
on:
  schedule:
    # 04:17 UTC: after most piko-newx releases of the night, off the busy top-of-hour slots.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Check every app for a build (publishing still skips unchanged inputs)
        type: boolean
        default: false
      app:
        description: Only this app (slug, e.g. youtube). Empty means all.
        type: string
        default: ""

# Never run two at once: they would race on creating and pruning releases.
concurrency:
  group: daily-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check for updates
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
      errors: ${{ steps.check.outputs.errors }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: mise run install
      - id: check
        run: bun src/main.ts check --github-output $FORCE $APP
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          APP: ${{ inputs.app && format('--app {0}', inputs.app) || '' }}

  build:
    name: Build ${{ matrix.slug }}
    needs: check
    if: needs.check.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    # The signing key lives only in this environment's secrets.
    environment: release
    permissions:
      contents: write # create releases
      id-token: write # build provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: mise run install
      # APKMirror's Cloudflare rejects plain requests from GitHub's IPs. trawl answers the challenges; the
      # build sends only APKMirror traffic through it, and its CA is trusted by that one curl alone.
      # Bound to localhost, and the container sees none of the signing secrets.
      - name: Start trawl
        run: |
          docker run -d --name trawl --shm-size=1gb \
            -p 127.0.0.1:8191:8191 -p 127.0.0.1:8192:8192 \
            -e SESSION_CACHE_DRIVER=memory -e MITM_ENABLED=true \
            ghcr.io/germondai/trawl:1.7.0@sha256:0f1bc8b88edb21dcc10a386bbcc1b852174fa2078dc6fa209c53170be303ebd0
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8191/health >/dev/null && break
            sleep 3
          done
          curl -sf http://127.0.0.1:8191/proxy-ca.crt -o "$RUNNER_TEMP/trawl-ca.crt"
          echo "APKMIRROR_PROXY_URL=http://127.0.0.1:8192" >> "$GITHUB_ENV"
          echo "APKMIRROR_PROXY_CA=$RUNNER_TEMP/trawl-ca.crt" >> "$GITHUB_ENV"
          echo "TRAWL_URL=http://127.0.0.1:8191" >> "$GITHUB_ENV"
      - name: Build and publish (${{ matrix.reason }})
        run: bun src/main.ts build ${{ matrix.slug }} --publish --work-dir .work
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      - name: trawl logs
        if: failure()
        run: docker logs trawl 2>&1 | tail -80 | cut -c1-220
      # Provenance attestations need a public repository (or Enterprise); never fail a published build over it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: hashFiles(format('.work/{0}/patched.apk', matrix.slug)) != ''
        continue-on-error: true
        with:
          subject-path: .work/${{ matrix.slug }}/patched.apk

  verdict:
    name: Report failures
    needs: [check, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if anything went wrong
        run: |
          if [ "${{ needs.check.result }}" != "success" ] || [ "${{ needs.check.outputs.errors }}" != "0" ] || [ "${{ needs.build.result }}" = "failure" ]; then
            echo "::error::check=${{ needs.check.result }} (errors: ${{ needs.check.outputs.errors }}), build=${{ needs.build.result }}"
            exit 1
          fi
