name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Public repo: fork PRs run here with no secrets, so block all egress except what the
          # toolchain (mise, node, bun, temurin, npm) and harden-runner itself need.
          egress-policy: block
          allowed-endpoints: >
            api.adoptium.net:443
            api.github.com:443
            api.stepsecurity.io:443
            bun.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: mise run install
      - run: mise run check
      - run: mise run test
