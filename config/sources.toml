# Patch repositories. Any repo that publishes `.mpp` bundles as GitHub releases can be added here.
# Only stable releases are ever used. `cooldown_hours` is how long a release must have been
# public before we pick it up, which skips the quick hotfix releases some repos ship.

[sources.morphe]
repo = "MorpheApp/morphe-patches"
versions = "patches-list"
cooldown_hours = 6

# Hushfeed patches TikTok and ships nearly every day; the cooldown trims same-day hotfixes.
[sources.hushfeed]
repo = "SysAdminDoc/HushFeed"
versions = "patches-list"
cooldown_hours = 6

# piko-newx ships several releases a day (sometimes minutes apart), so the cooldown matters most here.
[sources.piko-newx]
repo = "crimera/piko-newx"
versions = "bundle"
cooldown_hours = 6
# To require a valid signature on every bundle, add the maintainer's public key to
# config/keys/ and set: gpg_public_key = "keys/piko-newx.asc"

# riky's personal bundle: a few apps Morphe's own bundle does not cover, released rarely.
[sources.riky]
repo = "riky-dev/morphe-patches"
versions = "patches-list"
cooldown_hours = 6

# hoo-dles' bundle: many subscription apps Morphe's own bundle does not cover. Some patches are
# strict about the app version, which the patch list's targets handle.
[sources.hoo-dles]
repo = "hoo-dles/morphe-patches"
versions = "patches-list"
cooldown_hours = 6

# kveld's bundle: Brave plus Gboard, Hevy, TikTok, NokoPrint and Xiaomi Earbuds. Brave is the app
# we build from it; its targets carry the exact version the native patches expect.
[sources.kveld]
repo = "kveld9/kveld-morphe-patches"
versions = "patches-list"
cooldown_hours = 6
